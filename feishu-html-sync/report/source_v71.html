<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华曦达 SDMC｜2026H1 财报分析</title>
<style>




:root{
  --paper:#F6F3EC; --sheet:#FFFDF8; --ink:#1B1A17; --ink2:#4A463E; --ink3:#6E685C;
  --rule:#DDD6C8; --rule2:#EAE4D8;
  --sdmc:#B4442C; --sdmc-soft:#F4E3DD; --sky:#1F5F7A; --sky-soft:#DDEAF0;
  --inf:#9A5B00; --inf-soft:#FBEFD9; --tbd:#5A5853; --tbd-soft:#EFEDE8;
  --sans:"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;font:13px/1.55 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:#E9C9BE;color:var(--ink)}
.sheet{max-width:min(1520px,96vw);margin:16px auto 40px;background:var(--sheet);padding:28px 40px 24px;box-shadow:0 1px 2px rgba(40,30,10,.06),0 12px 40px rgba(40,30,10,.08)}
header.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font:700 30px/1.2 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .vs{color:var(--ink3);font-weight:400;margin:0 .25em}
h1 .a{color:var(--sdmc)} h1 .b{color:var(--sky)}
.meta{color:var(--ink2);font-size:12px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);justify-content:flex-end;max-width:470px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.t{display:inline-block;font:600 12px/1 var(--sans);padding:3px 5px 2px;border-radius:3px;vertical-align:1px;white-space:nowrap;letter-spacing:.02em}
.t.f{background:var(--ink);color:#fff}
.t.c{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.t.i{background:var(--inf-soft);color:var(--inf);box-shadow:inset 0 0 0 1px #E2C089}
.t.p{background:var(--tbd-soft);color:var(--tbd);box-shadow:inset 0 0 0 1px #C9C5BC}
.tbd{color:var(--tbd);background:#F1EEE7;padding:1px 6px;border-radius:3px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.toolbar{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:50}
.btn{font:600 12.5px/1 var(--sans);border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:9px 13px;border-radius:6px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn:hover{background:var(--ink);color:#fff}
.btn:focus-visible,.chart-edit:focus-visible{outline:2px solid var(--sdmc);outline-offset:2px}
.btn.primary{background:var(--sdmc);border-color:var(--sdmc);color:#fff}
.btn.primary:hover{background:#8E3220}
.btn[hidden]{display:none}

/* sections */
section.blk{padding-top:22px;margin-top:18px;border-top:1px solid var(--rule)}
section.blk>h2{font:700 19px/1.3 var(--serif);margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 .a,h2 .b{white-space:nowrap}
section.blk>h2 .k{font:600 12px var(--sans);color:var(--ink3)}
.lede{margin:0 0 12px;color:var(--ink2);max-width:90ch}
.grid{display:grid;gap:18px 28px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
figure{margin:0;min-width:0}
figure .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
figure .ft{font:700 13px var(--sans)}
.chart{width:100%;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cap{margin:6px 0 0;font-size:12.5px;font-weight:600;color:var(--ink)}
.cap::before{content:none}
.src{margin:3px 0 0;font-size:12px;color:var(--ink3);line-height:1.45}
.chart-edit{display:none;font:600 12px var(--sans);border:1px solid var(--rule);background:#fff;border-radius:4px;padding:3px 7px;cursor:pointer;color:var(--ink2)}
body.editing .chart-edit{display:inline-block}
.panel{display:none;margin-top:8px;border:1px solid var(--rule);background:#FBF9F4;border-radius:6px;padding:8px;overflow:auto}
.panel.open{display:block}
.panel table td input{width:100%;min-width:56px;font:12px var(--sans);border:1px solid var(--rule);padding:3px 4px;border-radius:3px;background:#fff}
.panel .pact{display:flex;gap:6px;margin-top:6px}
.panel .pact button{font:600 12px var(--sans);padding:4px 8px;border:1px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}

/* tables */
table.d{width:100%;border-collapse:collapse;font-size:12px}
table.d th{font-weight:600;text-align:left;color:var(--ink2);border-bottom:1.5px solid var(--ink);padding:5px 6px;vertical-align:bottom;background:transparent}
table.d td{border-bottom:1px solid var(--rule2);padding:5px 6px;vertical-align:top}
table.d td.num,table.d th.num{text-align:right;white-space:nowrap}
table.d tr.grp td{background:#F4F0E7;font-weight:700}
.a{color:var(--sdmc)}.b{color:var(--sky)}
.neg{color:var(--sdmc)}
ul.facts{margin:0;padding-left:0;list-style:none}
ul.facts li{padding:5px 0;border-bottom:1px solid var(--rule2)}
ul.facts li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);margin:4px 0 14px}
.kv div{padding:9px 12px 9px 0}
.kv b:not(.t){display:block;font:700 20px/1.1 var(--serif)}
.kv span{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink3)}
.sub{font:700 13px var(--sans);margin:4px 0 6px}
footer{margin-top:26px;border-top:2px solid var(--ink);padding-top:12px;font-size:12px;color:var(--ink2)}
footer .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
footer ol{margin:4px 0 0;padding-left:18px}
footer li{margin:2px 0}
body.editing [contenteditable="true"]{outline:1px dashed #D7A08F;outline-offset:1px;cursor:text}
body.editing [contenteditable="true"]:focus{outline:2px solid var(--sdmc);background:#FFF8F2}
body.editing .tbd{background:#FFF3C4;color:#6B5200}
.editbar{display:none;position:sticky;top:0;z-index:40;background:#1B1A17;color:#fff;font-size:12px;padding:8px 14px;margin:-36px -44px 16px}
body.editing .editbar{display:block}
table.fix{table-layout:fixed;width:100%}
.chg{margin:14px 0 6px;border:1px solid var(--rule);border-radius:6px;background:#FBF8F2;padding:10px 14px 8px}
.chg-h{font:700 13px var(--sans);margin-bottom:8px}
.chg-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.chg-row>div{display:flex;flex-direction:column;gap:2px;border-left:3px solid #E3D7C6;padding-left:9px;min-width:0}
.chg-row b{font:700 18px/1.3 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}
.chg-row span{font-size:12px;line-height:1.45;color:var(--ink2)}
.chg-src{margin:8px 0 0;font-size:12px;color:var(--ink3)}
table.d .h2c{background:#F6F2EA}
table.d th.h2c{color:var(--ink2)}
table.d td.qoq,table.d th.qoq{font-weight:600}
table.wide{min-width:760px}
ul.notes.big{font-size:13px;color:var(--ink2)}
.side-note{align-self:center}
@media (max-width:700px){.chg-row{grid-template-columns:1fr 1fr}.chg-row b{font-size:16px}}

.ft .cal{display:table;margin:3px 0 0 0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){
#s-cust table.fix,#s-cust table.fix tbody{display:block;width:100%}
#s-cust table.fix colgroup,#s-cust table.fix thead{display:none}
#s-cust table.fix tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 2px;border-bottom:1px solid var(--rule)}
#s-cust table.fix td{display:block;border:0;padding:0;flex:0 0 100%}
#s-cust table.fix td:first-child{font-weight:600}
#s-cust table.fix td.num,#s-cust table.fix td:has(> .t),#s-cust table.fix td:has(> .nd:only-child){flex:0 0 auto;text-align:left}
#s-cust table.fix tr.cont,#s-cust table.fix tr.subt,#s-cust table.fix tr.tot{gap:2px 10px}
#s-cust table.fix td:empty{display:none}
#t-top5 td:first-child{flex:0 0 auto}#t-top5 td:nth-child(2){flex:1 1 0}
}
table.d td,table.d th{overflow-wrap:anywhere}
table.d td.num,table.d th.num{text-align:right;white-space:nowrap}
table.d td.b{font-weight:700;color:var(--ink)}table.d td.b *{color:inherit}
.t,.nd,.cal{white-space:nowrap}
.glue{white-space:nowrap}
#t-geo tr.cont td{background:#F4EFE6;padding-top:7px;padding-bottom:5px;border-top:1px solid var(--rule)}
#t-geo .cont-v{margin-left:10px;font-size:12px;color:var(--ink3);font-weight:500}
table.d tr.subt td{color:var(--ink2);font-size:12px;border-bottom:1px solid var(--rule)}
table.d tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
ul.notes{margin:6px 0 0;padding-left:1.1em;font-size:12px;line-height:1.5;color:var(--ink3)}
ul.notes li{margin:1px 0}
.blkpart{margin-top:22px}
.grid.lead{align-items:start}
.dyn textarea,.dyn input{width:100%;box-sizing:border-box;font:inherit;border:1px solid #D7A08F;border-radius:3px;padding:2px 4px;background:#FFFBF7;resize:vertical}
.dyn td.num input{text-align:right}
body:not(.editing) .mini{display:none}


.btn.edit{background:var(--sdmc);color:#fff;border-color:var(--sdmc);font-weight:600;padding-inline:16px}
.btn.edit.on{background:#2F6B3A;border-color:#2F6B3A}
.xd-host{position:relative}
.xdel{position:absolute;top:2px;right:2px;z-index:5;width:22px;height:22px;border-radius:50%;border:1px solid #D7A08F;background:#fff;color:#A4472C;font:600 14px/1 system-ui;cursor:pointer;display:none;padding:0;opacity:.55}
body.editing .xdel{display:block}
.xd-host:hover>.xdel,.xd-host>td>.xdel:hover,.xdel:focus-visible{opacity:1}
.xdel:hover{background:#A4472C;color:#fff}
section.xd-host>.xdel{top:6px;right:6px;width:28px;height:28px;font-size:17px;opacity:.9}
@media print{.xdel{display:none!important}}

.kpiwrap{overflow-x:auto}
table.kpi td:first-child{white-space:nowrap}
table.kpi td:last-child{color:var(--ink3);font-size:12px}
h2 .a{color:var(--sdmc)} h2 .b{color:var(--sky)}
section.co-a{border-left:3px solid var(--sdmc);padding-left:16px}
section.co-b{border-left:3px solid var(--sky);padding-left:16px}
th.a{color:var(--sdmc)} th.b{color:var(--sky)}
@media screen and (max-width:900px){h1{font-size:24px}h1 .a,h1 .b{white-space:nowrap}.concl-label{flex-direction:column;gap:2px}table.d{display:block;overflow-x:auto}section.co-a,section.co-b{padding-left:10px}.sheet{padding:20px}.concl{grid-template-columns:1fr}.concl>div{border-right:0;border-bottom:1px solid var(--rule2);margin-right:0}.g2,.g3,.g21,.g12,.kv,footer .cols{grid-template-columns:1fr}header.top{grid-template-columns:1fr}.legend{justify-content:flex-start}.editbar{margin:-20px -20px 12px}}
@page{size:A4 landscape;margin:9mm}
@media print{html,body{background:#fff}h1{font-size:24px}h1 .a,h1 .b{white-space:nowrap}.sheet{background:#fff!important}body{font-size:12px}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}.toolbar,.chart-edit,.panel,.editbar,.toc{display:none!important}figure,tr,ul.facts li,.kv>div{break-inside:avoid}section.blk>h2{break-after:avoid}section.blk{break-before:auto}#s-sdmc,#s-sky,#s-cust,#s-ipo{break-before:page}a{color:inherit;text-decoration:none}}


/* optional UX: toc + jump */
.toc{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;padding:8px 0;margin:10px 0 0;background:linear-gradient(var(--sheet) 70%,rgba(255,253,248,.92));border-bottom:1px solid var(--rule);font-size:12px}
.toc .toc-lab{font-weight:700;color:var(--ink3);margin-right:4px;padding:4px 6px 4px 0}
.toc a{color:var(--ink2);text-decoration:none;padding:4px 9px;border-radius:4px;white-space:nowrap}
.toc a:hover,.toc a:focus-visible{background:var(--rule2);color:var(--ink);outline:none}
a.figref{color:var(--ink3);text-decoration:underline dotted;text-underline-offset:2px}
a.figref:hover{color:var(--sdmc)}
figure[id],section[id],#concl{scroll-margin-top:52px}
@media screen and (max-width:900px){.toc{top:0;gap:0}.toc a{padding:4px 7px}}

.nd{display:inline-block;font:600 12px/1 var(--sans);padding:3px 5px 2px;border-radius:3px;background:#F0EEE8;color:#6E685C;box-shadow:inset 0 0 0 1px #C9C5BC;letter-spacing:.02em}
.cal{display:inline-block;font:600 12px/1 var(--sans);padding:2px 5px;border-radius:3px;background:#EFE8DA;color:#6B5A3A;margin-left:6px;vertical-align:2px;white-space:nowrap}
.cal.os{background:#DDEAF0;color:#1F5F7A}
.cal.dom{background:#E8F0E4;color:#3F6B3A}
.cal.sub{background:#F1E6EE;color:#7A3F66}
.ckx .gh .cal{margin-left:2px;font-size:11px;padding:2px 4px}
.chtip .tsc{display:block;font-size:11px;color:#C9C2B3;margin-bottom:2px}
.cal-note{font-size:12px}
.viewsw{display:inline-flex;gap:0;margin-top:10px;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.viewsw button{font:600 12px/1 var(--sans);border:0;background:var(--sheet);color:var(--ink);padding:7px 12px;cursor:pointer;border-right:1px solid var(--rule)}
.viewsw button:last-child{border-right:0}
.viewsw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dv{border-bottom:1px dotted transparent;cursor:default}
body.editing .dv[data-k]{border-bottom-color:#D7A08F;cursor:pointer}
body.editing .dv[data-k]:hover{background:#FFF8F2}
.chtip{position:fixed;z-index:100;background:#1B1A17;color:#fff;font:12px/1.35 var(--sans);padding:6px 9px;border-radius:4px;pointer-events:none;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
.mini{font:600 12px var(--sans);padding:2px 6px;border:1px solid var(--rule);background:#fff;border-radius:3px;cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini{white-space:nowrap}
table.dyn input,table.dyn textarea{width:100%;min-width:48px;font:12px/1.45 var(--sans);color:var(--ink);border:1px solid var(--rule);padding:3px 5px;border-radius:3px;background:#fff}
table.dyn textarea{display:block;resize:none;field-sizing:content;min-height:24px;overflow:hidden}
table.dyn input:focus,table.dyn textarea:focus{outline:2px solid var(--sdmc);outline-offset:0;border-color:transparent}
table.d td.num+td.num,table.d th.num+th.num{padding-left:14px}
table.dyn input::placeholder{color:var(--tbd)}
.tbd.filled{background:#FFF8E0;color:var(--ink);background-image:none}
.fno{font-weight:700}
body.view-s [data-co="k"]{display:none!important}
body.view-k [data-co="s"]{display:none!important}


/* v6: conclusions — calm ledger */
.concl-label{font:700 15px/1.3 var(--serif);margin:26px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.concl-label small{font:400 12px var(--sans);color:var(--ink3)}
.concl{list-style:none;margin:10px 0 4px;padding:0;border-top:1px solid var(--rule)}
.concl>li{display:grid;grid-template-columns:28px minmax(0,40em) minmax(240px,1fr);column-gap:20px;align-items:start;padding:16px 8px 15px 0;border-bottom:1px solid var(--rule2);cursor:pointer;transition:background .15s}
.concl>li:hover{background:#FBF8F2}
.concl>li:focus-visible{outline:2px solid var(--sdmc);outline-offset:-2px}
.concl .n{font:600 15px/1.6 var(--serif);color:var(--ink3);text-align:right;font-variant-numeric:lining-nums}
.concl h3{font:700 16px/1.6 var(--sans);margin:0;color:var(--ink);max-width:40em;text-wrap:pretty}
.concl h3 em{font-style:normal;color:var(--sdmc)}
.concl .cs{margin:3px 0 0;font-size:13px;line-height:1.7;color:var(--ink2);max-width:40em}
.concl .tg{font:500 12px var(--sans);color:var(--ink3);margin-left:6px;letter-spacing:.04em}
.concl .tg::before{content:"· "}
.concl .cd{margin-top:4px;font-size:12.5px;line-height:1.7;color:var(--ink2)}
.concl .cd summary{display:inline-block;cursor:pointer;color:var(--ink3);font-size:12px;list-style:none;padding:1px 0;border-bottom:1px dotted var(--rule)}
.concl .cd summary::-webkit-details-marker{display:none}
.concl .cd summary::after{content:" ▸";font-size:10px}
.concl .cd[open] summary::after{content:" ▾"}
.concl .cd summary:hover,.concl .cd summary:focus-visible{color:var(--ink);outline:none;border-bottom-color:var(--ink3)}
.concl .cd p{margin:6px 0 2px;max-width:40em}
.concl .cd .ref{font-size:12px;color:var(--ink3)}
.concl .ckx{padding-top:2px;min-width:0}
.ckx .mg{display:grid;grid-template-columns:auto auto 12px auto minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:end}
.ckx .grp,.ckx .mr{display:contents}
.ckx .gh{grid-column:1/-1;display:flex;align-items:baseline;gap:6px;font:600 12.5px/1.4 var(--sans);color:var(--ink);border-top:1px solid var(--rule2);padding-top:8px;margin-top:6px}
.ckx .grp:first-child .gh{border-top:0;padding-top:0;margin-top:0}
.ckx .gh i{font:400 11.5px var(--sans);font-style:normal;color:var(--ink3)}
.ckx .ml{font-size:12px;color:var(--ink2);white-space:nowrap;padding-bottom:1px}
.ckx .v0,.ckx .v1{display:flex;flex-direction:column;align-items:flex-end;font:600 16px/1.2 var(--serif);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;color:var(--ink)}
.ckx .v0{color:var(--ink3);font-weight:500}
.ckx small{font:400 10.5px/1.35 var(--sans);color:var(--ink3);letter-spacing:0}
.ckx .ar{color:var(--ink3);text-align:center;padding-bottom:1px;font-size:12px}
.ckx .chg{justify-self:start;padding-left:6px;font:600 12px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap;padding-bottom:2px}
.ckx .mm{grid-column:1/-1;margin:4px 0 0;font-size:12px;line-height:1.6;color:var(--ink2);text-wrap:pretty}
@media screen and (max-width:900px){.concl .ckx{grid-column:2}.ckx .mg{grid-template-columns:auto auto 12px auto minmax(0,1fr)}}
@media screen and (max-width:480px){.ckx .ml{grid-column:1/-1;padding-top:2px}.ckx .mg{grid-template-columns:auto 12px auto minmax(0,1fr)}.ckx .v0{align-items:flex-start}}
.concl .ck{display:flex;gap:28px;justify-content:flex-end;padding-top:2px}
.concl .ck>div{display:flex;flex-direction:column;align-items:flex-end;min-width:84px}

.concl .ck b i{font:500 12px var(--sans);font-style:normal;color:var(--ink3);margin-left:3px}
.concl .ck .lb{font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap}
@media screen and (max-width:900px){
 .concl-label{flex-direction:column;gap:2px}
 .concl>li{grid-template-columns:22px minmax(0,1fr);row-gap:10px;padding:14px 0}
 .concl .ck{grid-column:2;justify-content:flex-start;gap:24px}
 .concl .ck>div{align-items:flex-start}
 .concl h3{font-size:15px}
}
@media print{.concl>li{break-inside:avoid;padding:10px 0}.concl .cd summary{display:none}.concl>li:hover{background:none}}
/* v8: plain-language */
h1 .a,h1 .b{white-space:nowrap}
.concl .ck b.two{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:18px;line-height:1.25}
.concl .ck b.two small{font:400 12px/1 var(--sans,inherit);color:var(--mut,#6b665d);margin-right:6px;letter-spacing:0}
.gl h2{margin-bottom:8px}

<section class="blk" id="s-concl"><h2><span>核心结论</span></h2>
<div class="cap"><b>总体判断：四点结论，后文各板块逐一展开</b></div>
<ol class="cl37">
<li data-co="s"><b>在做什么：</b>按订单预测提前备货<b class="t f it">事实</b>，带有押注价格继续上涨的成分<b class="t i it">推断</b>。2026H1 净利润 1.81 亿元人民币，经营现金流为 −6.24 亿元人民币，差额主要被存货占用，明细见现金流部分<b class="t c it">计算</b>。</li>
<li data-co="s"><b>利润从哪来：</b>2026H1 毛利增量主要来自零件及配件转售<b class="t c it">计算</b>。按 2025 年 7 月至 2026 年 6 月利润：只剔除零件及配件转售超额毛利与坏账准备转回后，市盈率约 53.3 倍<b class="t i it">推断</b>；在此基础上再试算扣减低价库存整机毛利上限后约 59.5 倍<b class="t i it">推断</b>（2025H2 第③行未估算、两期口径不齐，1.81 亿元人民币并非整齐下限，真实水平可能更低<b class="t i it">推断</b>）。约为港股硬件 ODM 中位数 18.69 倍的约 2.9 至 3.2 倍<b class="t i it">推断</b>。</li>
<li data-co="s"><b>手头钱紧不紧：</b>2026 年 6 月 30 日募资以外可自由动用的资金约 1.35 亿元人民币，少于全部一年内到期的计息借款 7.32 亿元人民币<b class="t c it">计算</b>；IPO 募资净额同日仍全部未动用<b class="t f it">事实</b>。</li>
<li data-co="s"><b>主要风险：</b>2026 年 6 月 30 日存货 20.93 亿元人民币，接近总资产的一半<b class="t c it">计算</b>；客户预付在 2026H1 大幅增加<b class="t f it">事实</b>。2027-05-27起解除禁售的老股约为首日流通量的 9.9 倍<b class="t c it">计算</b>，其中董事和高管直接持有的部分每年最多转让 25%<b class="t f it">事实</b>。</li>

</ol></section>

实</b>。A 2024 年收入 486 亿元人民币、2022 年开始合作<b class="t f it">事实</b>。J 2021 年成立、2025 年开始合作<b class="t f it">事实</b>。</p></div><div class="judg"><p>F 做消费电子和车用存储芯片，2020 年开始合作；K 做半导体及电子元器件研发和销售，2021 年开始合作<b class="t f it">事实</b>。</p></div></div></div><div class="duo"><div class="duo-l"><div class="sub2">应付、预付与受限存款</div><div class="tscroll"><table class="d" id="t-s-supbal"><thead><tr><th class="nw1">亿元人民币</th><th class="num">2024 年末</th><th class="num">2025 年末</th><th class="num">2026 年 6 月末</th></tr></thead><tbody><tr><td>应付账款及票据</td><td class="nw1 num">7.91</td><td class="nw1 num">8.62</td><td class="nw1 num">13.69</td></tr><tr><td>付款周期（天，按平均应付款计算）</td><td class="nw1 num"><span class="nw">128<b class="t f it">事实</b></span></td><td class="nw1 num"><span class="nw">111<b class="t f it">事实</b></span></td><td class="nw1 num"><span class="nw">122<b class="t f it">事实</b></span></td></tr><tr><td>其中付给供应商的预付款（招股书明细）</td><td class="nw1 num">0.20</td><td class="nw1 num">1.99</td><td class="nw1"><span class="nd">未披露</span></td></tr><tr><td>已抵押及受限制存款（开银行承兑汇票、保函）</td><td class="nw1 num">0.90</td><td class="nw1 num">0.53</td><td class="nw1 num">1.20</td></tr></tbody></table></div><p class="src">来源：华曦达招股书、华曦达2026中报<b class="t f it">事实</b>。</p></div><div class="duo-r"><div class="judg"><p>2026H1 应付和付款周期上升，公司称因原料涨价和按订单多采购<b class="t f it">事实</b>。公司用主芯片供应商账期为存储芯片囤货垫钱<b class="t i it">推断</b>。双翼科技既是 ODM 供应商又是股东：连同第一大股东曾共持股 4.9802%（2022 年末 2.8001%），华曦达 2021 年审慎列为关联方，招股书称独立第三方<b class="t f it">事实</b>。</p></div></div></div><div class="duo"><div class="duo-l"><div class="sub2">应付款余额与付款周期</div><div class="tscroll"><table class="d" id="t-s-pay"><thead><tr><th>应付账款及票据（亿元人民币）</th><th class="num">2025 年末</th><th class="num">2026 年 6 月末</th></tr></thead><tbody><tr><td class="nw1">余额</td><td class="nw1 num"><span class="nw">8.617<b class="t f it">事实</b></span></td><td class="nw1 num"><span class="nw">13.69<b class="t f it">事实</b></span></td></tr><tr><td>其中贸易应付款项</td><td class="nw1 num"><span class="nw">7.02 function fmt(v, flags){
  if(v==null||(typeof v==='number'&&isNaN(v))) return null;
  flags=flags||'f2';
  if(flags==='gl'){ return (v>=0?'收益 ':'损失 −')+Math.abs(v).toFixed(3); }
  const neg=v<0, av=Math.abs(v);
  let s;
  if(flags.startsWith('p')||flags.startsWith('sp')||flags==='pv2'){
    const dig=flags==='pv2'?2:(flags.match(/\d/)||['0'])[0];
    s=(av*100).toFixed(+dig)+'%';
    if(flags.startsWith('sp')) s=(v>=0?'+':'−')+s;
    else if(neg) s='−'+s;
    return s;
  }
  if(flags.startsWith('x')){ const dig=+(flags.slice(1)||1); s=av.toFixed(dig); return (neg?'−':'')+s; }
  if(flags==='d0') return String(Math.round(v)).replace('-','−');
  if(flags==='si'){ const n=Math.round(v); return String(n).replace('-','−'); }
  const dig=flags.match(/f(\d)/)? +flags.match(/f(\d)/)[1] : 2;
  s=av.toFixed(dig);
  if(flags.startsWith('sf')||flags.startsWith('sp')){
    // sf already handled for p; for f:
    if(flags.startsWith('sf')) s=(v>0?'+':'')+(neg?'−':'')+s.replace(/^\+/,'');
    // fix: 
    s=(v>0?'+':(v<0?'−':''))+av.toFixed(dig);
  } else if(neg) s='−'+s;
  return s;
}
// fix fmt for sf
function fmt2(v, flags){
  if(flags==='gl'){ if(v==null||(typeof v==='number'&&isNaN(v))) return null; return (v>=0?'收益 ':'损失 −')+Math.abs(v).toFixed(3); }
  if(v==null||(typeof v==='number'&&isNaN(v))) return null;
  flags=flags||'f2';
  if(flags==='si'){ const n=Math.round(v); return String(n).replace('-','−'); }
  if(flags==='d0') return String(Math.round(v)).replace('-','−');
  if(flags.startsWith('x')){ const dig=+(flags.slice(1)||1); return (v<0?'−':'')+Math.abs(v).toFixed(dig); }
  if(flags.startsWith('pv')) return Math.abs(v).toFixed(+(flags.slice(2)||2))+'%'; // percent points stored as 12.62 meaning 12.62%
  // Note: domgm/osgm stored as 12.62 not 0.1262
  if(flags.startsWith('sp')){
    const dig=+(flags.match(/\d/)||['0'])[0];
    const pct=(Math.abs(v)*100).toFixed(dig)+'%';
    return (v<0?'−':'')+pct;
  }
  if(flags.startsWith('p')){
    const dig=+(flags.match(/\d/)||['0'])[0];
    return (v<0?'−':'')+(Math.abs(v)*100).toFixed(dig)+'%';
  }
  const dig=flags.match(/f(\d)/)? +flags.match(/f(\d)/)[1] : 2;
  const body=Math.abs(v).toFixed(dig);
  
  return (v<0?'−':'')+body;
}

/* resolve value refs in charts */
function resolveRef(x){
  if(x==null) return null;
  if(typeof x==='number') return x;
  if(typeof x!=='string') return x;
  if(x.startsWith('@')){ const k=x.slice(1); return DATA.calc[k]!=null?DATA.calc[k]:null; }
  if(x in DATA.v) return V(x);
  return num(x);
}

/* ===== template bind ===== */
function evalExpr(expr){
  const wrap=v=>(v==null||isNaN(v))?'NaN':('('+v+')');
  let e=expr.replace(/\$([~^]?)([A-Za-z0-9_.]+)/g,(_,m,k)=>{
    let v=k.startsWith('@')?DATA.calc[k.slice(1)]:V(k.replace(/^@/,''));
    if(v!=null&&m){const f=m==='~'?100:1000; v=Math.round(v*f)/f;}
    return wrap(v);
  });
  e=e.replace(/@([A-Za-z0-9_]+)/g,(_,k)=>wrap(DATA.calc[k]));
  try{ const r=Function('"use strict";return ('+e+')')(); return (typeof r==='number'&&isFinite(r))?r:null; }catch(err){ return null; }
}

function renderToken(tok){
  // tok like s.rev.26 or @R_S26|x2 or =$s.a/$s.b-1|sp0 or #s_pl
  if(tok.startsWith('#')){ const key=tok.slice(1); return figNo[key]!=null?('<a class="figref" href="#fig-'+key+'">'+figNo[key]+'</a>'):''; }
  let flags='f2', body=tok;
  const pipe=tok.lastIndexOf('|');
  if(pipe>0){ flags=tok.slice(pipe+1); body=tok.slice(0,pipe); }
  let val;
  if(body.startsWith('=')) val=evalExpr(body.slice(1));
  else if(body.startsWith('@')) val=DATA.calc[body.slice(1)];
  else val=V(body);
  // special: gm stored as percent points use pv2
  if(flags.startsWith('pv') && val!=null && !(body in DATA.v)) return fmt2(val, flags);
  const out=fmt2(val, flags);
  if(out==null) return '<span class="nd">未披露</span>';
  // editable if direct key
  if(!body.startsWith('=')&&!body.startsWith('@')&& body in DATA.v){
    const src=DATA.src[body]||'';
    const neg=val!=null&&val<0?' neg':'';
    return '<span class="dv'+neg+'" data-k="'+body+'" data-src="'+src.replace(/"/g,'&quot;')+'" title="'+(src||body)+'">'+out+'</span>';
  }
  return '<span class="dv'+(val!=null&&val<0?' neg':'')+'" title="计算">'+out+'</span>';
}

function bindTemplates(root){
  const walk=(node)=>{
    if(node.nodeType===3){
      const t=node.nodeValue;
      if(t.indexOf('{{')<0) return;
      const html=t.replace(/\{\{([^{}]+)\}\}/g,(_,tok)=>'<span class="tk" contenteditable="false" data-tok="'+tok.trim().replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+renderToken(tok.trim())+'</span>');
      if(html===t) return;
      const span=document.createElement('span');
      span.className='tb'; span.innerHTML=html;
      node.parentNode.replaceChild(span,node);
      return;
    }
    if(node.nodeType!==1) return;
    if(node.classList&&(node.classList.contains('panel')||node.classList.contains('chart'))) return;
    // attributes? skip
    const ch=[...node.childNodes];
    ch.forEach(walk);
  };
  // Work on a fresh clone of template stored once
  walk(root);
}

function glueTags(root){ return; /* v71: badges stay unbreakable via .t{white-space:nowrap}; surrounding text wraps normally */
  root.querySelectorAll('.t,.nd').forEach(tg=>{
    if(tg.closest('.chart,.panel,.dyn,svg,.legend')) return;
    const p=tg.previousSibling; if(p&&p.nodeType===1&&(p.classList.contains('tk')||p.classList.contains('tb'))&&p.textContent.length<=12){const g=document.createElement('span');g.className='glue';tg.parentNode.insertBefore(g,tg);g.appendChild(p);g.appendChild(tg);return;} if(!p||p.nodeType!==3) return;
    const t=p.nodeValue; const m=t.match(/(\S{1,3})\s?$/); if(!m) return;
    const g=document.createElement('span'); g.className='glue';
    p.nodeValue=t.slice(0,t.length-m[0].length); tg.parentNode.insertBefore(g,tg); g.appendChild(document.createTextNode(m[0])); g.appendChild(tg);
  });
}

/* ===== charts ===== */
function resolveChart(spec){
  const s=deepClone(spec);
  if(s.series) s.series.forEach(ser=>{ ser.values=ser.values.map(resolveRef); });
  if(s.lines) s.lines.forEach(ser=>{ ser.values=ser.values.map(resolveRef); });
  if(s.steps) s.steps.forEach(st=>{ st.value=resolveRef(st.value); });
  if(s.rows) s.rows.forEach(r=>{ r.value=resolveRef(r.value); });
  return s;
}

function _cellR(ref,fl){ let v=null,body=null;

function _perOf(l){ l=String(l); let m=l.match(/(20\d\d)年(上|下)半年/); if(m) return {y:+m[1],h:m[2]==='上'?1:2,t:'h'};
  m=l.match(/^(20\d\d)\s*年?(全年)?$/)||l.match(/(20\d\d)年全年/); if(m) return {y:+m[1],t:'y'};
  m=l.match(/(20\d\d)-12-31|(20\d\d)年末/); if(m) return {y:+(m[1]||m[2]),t:'ye'};
  m=l.match(/(20\d\d)-06-30|(20\d\d)年6月末/); if(m) return {y:+(m[1]||m[2]),t:'mid'};
  return null; }
function _isPer(s){ return _perOf(s)!=null||/20\d\d-\d\d-\d\d|月末/.test(String(s)); }
function _chg(a,b,mode){ if(a==null||b==null||isNaN(a)||isNaN(b)) return null;

function _brk(cols,vals,j,mode){ const p=_perOf(cols[j]); const parts=[];

    if(iy>=0){const c=_chg(vals[j],vals[iy],mode); if(c) parts.push('同比 '+c);} if(iq>=0){const c=_chg(vals[j],vals[iq],mode); if(c) parts.push('环比 '+c);} }
  else if(p&&p.t==='y'){ const iy=find(q=>q.t==='y'&&q.y===p.y-1); if(iy>=0){const c=_chg(vals[j],vals[iy],mode); if(c) parts.push('同比 '+c);} }
  else if(p&&(p.t==='mid'||p.t==='ye')&&j===cols.length-1){ let ib=-1; for(let i=j-1;i>=0;i--){const q=_perOf(cols[i]); if(q&&q.t==='ye'&&q.y<p.y+(p.t==='mid'?1:0)&&!(q.y===p.y&&p.t==='ye')){ib=i;break;}}

  return parts.length?'<span class="gr">（'+parts.join('，')+'）</span>':''; }

function _prevIdx(cols,j,kind){ const p=_perOf(cols[j]); const find=f=>cols.findIndex(c=>{const q=_perOf(c); return q&&f(q);});
  if(kind==='qoq'){ if(p&&p.t==='h') return find(q=>q.t==='h'&&(p.h===1?(q.y===p.y-1&&q.h===2):(q.y===p.y&&q.h===1))); return -1; }
  if(kind==='yoy'){ if(p&&p.t==='h') return find(q=>q.t==='h'&&q.y===p.y-1&&q.h===p.h); if(p&&p.t==='y') return find(q=>q.t==='y'&&q.y===p.y-1); return -1; }
  if(kind==='prev'){ if(p&&(p.t==='h'||p.t==='y')) return -1; return j>0?j-1:-1; }

function _subRows(cols,vals,mode){

  const btn=document.getElementById('bSaveFeishu');
  if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  fetch(SAVE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file_token:SAVE_FILE_TOKEN,edit_key:key,html:html})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(ok&&j&&j.ok){ alert('已覆盖飞书同链。刷新或重新下载即可看到最新版。'); takeSnap&&takeSnap(); }
      else alert('保存失败：'+((j&& (j.error&&JSON.stringify(j.error)||j.msg))||'网络或密钥错误'));
    })
    .catch(e=>alert('保存失败：'+e))
    .finally(()=>{ if(btn){ btn.disabled=false; btn.textContent='☁ 保存到飞书'; } });
}

function doCopy(open){
  const ops=collectEdits();
  if(!ops.length){ alert('还没有修改。'); return; }
  const text=editsText(ops); window.__lastSync=text;
  const hdrs={'Content-Type':'application/json'};
  if(SYNC_AUTH) hdrs['Authorization']=SYNC_AUTH;
  const body=JSON.stringify({msg_type:'text',content:{text},text});
  const post=()=> SYNC_WEBHOOK ? fetch(SYNC_WEBHOOK,{method:'POST',mode:'cors',headers:hdrs,body}).then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json().catch(()=>({ok:true})); }) : Promise.reject(new Error('no webhook'));
  copyText(text).then(ok=>{
    post().then(function(j){
      const msg=(ok?'已同步 '+ops.length+' 处修改（无需粘贴）。':'已提交同步；若需备份可在下方框复制。')+(j&&j.drop?'':'');
      showCopyBox(text, msg);
    }).catch(function(err){
      showCopyBox(text,(ok?'已复制 '+ops.length+' 处修改。':'请在下面框内全选后复制。')+(open&&SYNC_INBOX?' 自动同步失败，请粘贴到打开的「同步修改收件箱」文档最下方（Ctrl/⌘+V）。':' 自动同步失败，请粘贴到聊天里发给我。')+' ['+(err&&err.message?err.message:'err')+']');
      if(open&&SYNC_INBOX){ try{ window.open(SYNC_INBOX,'_blank','noopener'); }catch(e){} }
    });
  });
}

window.__applySync=function(ops){ const t=document.getElementById('report-tpl'), res=[];
  const find=(eid,old)=>{ let n=t.content.querySelector('[data-eid="'+eid+'"]'); if(n&&n.innerHTML===old) return n;
    const c=[...t.content.querySelectorAll('[data-eid]')].filter(x=>x.innerHTML===old); return c.length===1?c[0]:null; };
  ops.forEach(o=>{ try{
    if(o.op==='edit'){ const n=find(o.eid,o.old); if(n){ n.innerHTML=o.new; res.push('ok'); } else res.push('miss'); }
    else if(o.op==='del'){ const n=find(o.eid,o.old); if(n){ n.remove(); res.push('ok'); } else res.push('miss'); }
    else if(o.op==='data'){ if(o.key[0]==='@') DATA[o.key.slice(1)]=o.new; else DATA.v[o.key]=o.new; res.push('ok'); }
  }catch(e){ res.push('err:'+e); } });
  rebuildSheet(); return res; };
window.__collectEdits=collectEdits; window.__editsText=()=>editsText(collectEdits());
document.getElementById('bSync').addEventListener('click',()=>doCopy(true));
document.getElementById('bCopy').addEventListener('click',()=>doCopy(false));

rebuildSheet(); takeSnap();
})();

</script>
